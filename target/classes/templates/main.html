{% extends "topbar" %}

{% block head %}
<title>PA System</title>
<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        margin: 0;
        padding-top: 10px;
        font-family: sans-serif;
        background-color: #f0f0f0;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-image: url('/static/toliet.jpg');
    }
    .cont {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        margin-top: 10px; 
    }
    .cont .emg {
        width: 100px;
        height: 100px;
        border-radius: 25px;
        background-color: rgba(255, 0 , 0, 1);
        background-image: url('/static/bell.svg');
        background-size: 50% 50%;
        background-repeat: no-repeat;
        background-position: center;
        transition: background-color 0.2s;
        border: none;
        cursor: pointer;
    }
    .cont .emg.active {
        background-color: rgba(0, 255, 0, 1);
    }
    .cont .p2t {
        width: 200px;
        height: 200px;
        border-radius: 50px;
        background-color: rgba(0, 107, 179, 1);
        background-image: url('/static/microphone.svg');
        background-size: 50% 50%;
        background-repeat: no-repeat;
        background-position: center;
        border: none;
        cursor: pointer;
    }
    .cont .p2t:active, .cont .p2t.recording {
        background-color: rgba(1, 69, 115, 1);
    }
    .cont .btn-row {
        display: flex;
        flex-direction: row;
        gap: 10px;
    }
    .cont .btn-row .btn {
        border-radius: 12.5px;
        width: 50px;
        height: 50px;
        background-color: rgba(250, 211, 54, 1);
        border: none;
        cursor: pointer;
        font-weight: bold;
    }
    .cont .btn-row .btn:active {
        background-color: rgba(171, 145, 41, 1);
        background-image: url('issy.png');
        background-size: 50% 50%;
    }
    #audioOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
    }
    #audioOverlay .box {
        background: white;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
    }
    #audioOverlay button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
    #speakerContainer {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        align-items: center;
        max-width: 80%;
        z-index: 9999;
    }
    .speakerTag {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 10px;
        background: white;
        color: black;
        font-size: 14px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .speakerTag img {
        width: 18px;
        height: 18px;
    }
    .drp select {
        padding: 8px;
        border-radius: 5px;
        font-size: 14px;
        min-width: 160px;
    }
    .dropdown-wrapper {
        margin: 4px 0;
    }
</style>
{% endblock %}

{% block content %}
<div id="audioOverlay">
    <div class="box">
        <h2>Enable Audio</h2>
        <p>Click to allow sound + voice</p>
        <button id="enableAudioBtn">Enable</button>
    </div>
</div>

<div class="cont">
    <button class="p2t" id="pttBtn"></button>
    <div class="drp" id="userContainer"></div>
    
    <div class="btn-row">
        <button class="btn" id="addBtn" onclick="addUserDropdown()">[+]</button>
        <button class="btn" onclick="removeUserDropdown()">[-]</button>
    </div>
    
    <br>
    
    <button class="emg" id="alarmBtn"></button>
</div>

<div id="speakerContainer"></div>
{% endblock %}

{% block scripts %}
<script src="/static/notifications.js"></script>
<script>
    let globalUsersList = [];
    let activeAlertsMap = new Map();
    let audioContextInitialized = false;
    let audioCtx = null;
    let audioIoWs = null;
    let speakWs = null;
    let micStream = null;
    let isRecording = false;
    let spacePressed = false;
    
    // Track alarm toggle state
    let isAlarmActive = false;

    // Click trigger setup 
    document.getElementById('enableAudioBtn').onclick = async () => {
        document.getElementById('audioOverlay').style.display = 'none';
        initAudioEngine();
        initWebSockets();
        
        // Strict Documentation updates: 1s polling loops ONLY
        setInterval(fetchUsers, 1000);
        setInterval(checkAlerts, 1000);
        
        fetchUsers();
    };

    function initAudioEngine() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
        audioContextInitialized = true;
    }

    function initWebSockets() {
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const host = window.location.host;

        function connectAudioIo() {
            audioIoWs = new WebSocket(protocol + host + '/audio_io');
            audioIoWs.binaryType = 'arraybuffer';
            
            audioIoWs.onopen = () => {
                audioIoWs.send("GET_AUDIO_STREAM");
            };

            audioIoWs.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    try {
                        const activeSpeakers = JSON.parse(event.data);
                        renderSpeakers(activeSpeakers);
                    } catch(e) {}
                } else {
                    playRawBytes(event.data);
                }
            };

            audioIoWs.onclose = () => {
                // Handle UI Fallbacks on disconnection
                handleWsDisconnectUi();
                setTimeout(connectAudioIo, 2000); // Auto-reconnect after 2 seconds
            };
            
            audioIoWs.onerror = () => {
                audioIoWs.close();
            };
        }

        function connectSpeak() {
            speakWs = new WebSocket(protocol + host + '/speak');
            
            speakWs.onclose = () => {
                // Handle UI Fallbacks on disconnection
                handleWsDisconnectUi();
                setTimeout(connectSpeak, 2000); // Auto-reconnect after 2 seconds
            };

            speakWs.onerror = () => {
                speakWs.close();
            };
        }

        connectAudioIo();
        connectSpeak();
    }

    // Clears active speaker panels and resets selected texts to "--"
    function handleWsDisconnectUi() {
        // Reset dynamic speakers container UI
        const container = document.getElementById('speakerContainer');
        if (container) container.innerHTML = '';

        // Fallback dropdown text representations to "--"
        const selects = document.querySelectorAll('#userContainer select');
        selects.forEach(select => {
            if (select.options.length > 0 && !select.querySelector('option[value="--"]')) {
                const fallbackOpt = document.createElement('option');
                fallbackOpt.value = "--";
                fallbackOpt.innerText = "--";
                select.insertBefore(fallbackOpt, select.firstChild);
                select.value = "--";
            }
        });
    }

	let pcmWorkletNode = null;

	async function initAudioEngine() {
		audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
		
		// 1. Load the external worklet processor script
		await audioCtx.audioWorklet.addModule('/static/pcm-processor.js');
		
		// 2. Instantiate the node
		pcmWorkletNode = new AudioWorkletNode(audioCtx, 'pcm-processor');
		pcmWorkletNode.connect(audioCtx.destination);
		
		audioContextInitialized = true;
	}

// 3. Feed your incoming 960-byte WebSocket binary chunks into the worklet
function playRawBytes(arrayBuffer) {
    if (!audioContextInitialized || !audioCtx || !pcmWorkletNode) return;
    
     // Verify chunk size matches your 960-byte expectation (480 samples * 2 bytes)
    if (arrayBuffer.byteLength !== 960) {
        // Optional safety fallback if a variable chunk arrives
    }

    // Transfer the ArrayBuffer safely to the audio worklet thread
    pcmWorkletNode.port.postMessage(arrayBuffer, [arrayBuffer]);
}

    function renderSpeakers(speakersList) {
        const container = document.getElementById('speakerContainer');
        container.innerHTML = '';
        speakersList.forEach(speaker => {
            const tag = document.createElement('div');
            tag.className = 'speakerTag';
            tag.innerHTML = `<img src="/static/speaker.svg" alt="spk"> <span>${speaker.name || speaker.ip}</span>`;
            container.appendChild(tag);
        });
    }

    // Dynamic dropdown management
    async function fetchUsers() {
        try {
            const res = await fetch('/get_users');
            globalUsersList = await res.json();
            updateDropdownOptions();
        } catch(e) {}
    }

    function addUserDropdown() {
        const container = document.getElementById('userContainer');
        const wrappers = container.getElementsByClassName('dropdown-wrapper');
        
        if (wrappers.length === 1) {
            const firstSelect = wrappers[0].querySelector('select');
            if (firstSelect && firstSelect.value === 'BROADCAST') return;
        }

        const div = document.createElement('div');
        div.className = 'dropdown-wrapper';
        const select = document.createElement('select');
        select.onchange = handleDropdownSelectionChange;
        div.appendChild(select);
        container.appendChild(div);
        
        updateDropdownOptions();
    }

    function removeUserDropdown() {
        const container = document.getElementById('userContainer');
        if (container.lastChild) {
            container.removeChild(container.lastChild);
            updateDropdownOptions();
            syncIPSelectionToWS();
        }
    }

    function updateDropdownOptions() {
        const container = document.getElementById('userContainer');
        const wrappers = container.getElementsByClassName('dropdown-wrapper');
        
        if (wrappers.length === 0) {
            const div = document.createElement('div');
            div.className = 'dropdown-wrapper';
            const select = document.createElement('select');
            select.onchange = handleDropdownSelectionChange;
            div.appendChild(select);
            container.appendChild(div);
        }

        const totalDropdowns = wrappers.length;
        const currentSelections = Array.from(wrappers).map(w => w.querySelector('select').value);

        Array.from(wrappers).forEach((wrapper, idx) => {
            const select = wrapper.querySelector('select');
            const previousVal = currentSelections[idx] || '';
            select.innerHTML = '';

            if (totalDropdowns === 1) {
                const opt = document.createElement('option');
                opt.value = 'BROADCAST';
                opt.innerText = 'BROADCAST';
                select.appendChild(opt);
            }

            globalUsersList.forEach(user => {
                const isSelectedElsewhere = currentSelections.some((val, sIdx) => sIdx !== idx && val === user.ip);
                if (!isSelectedElsewhere) {
                    const opt = document.createElement('option');
                    opt.value = user.ip;
                    opt.innerText = user.name;
                    select.appendChild(opt);
                }
            });

            if (previousVal && select.querySelector(`option[value="${previousVal}"]`)) {
                select.value = previousVal;
            } else if (select.options.length > 0) {
                select.selectedIndex = 0;
            }
        });
    }

    function handleDropdownSelectionChange() {
        updateDropdownOptions();
        syncIPSelectionToWS();
    }

    function getSelectedIPs() {
        const selects = document.querySelectorAll('#userContainer select');
        let ips = [];
        selects.forEach(sel => {
            if (sel.value === 'BROADCAST') {
                ips = globalUsersList.map(u => u.ip);
            } else if (sel.value && sel.value !== "--") {
                ips.push(sel.value);
            }
        });
        return [...new Set(ips)];
    }

    function syncIPSelectionToWS() {
        if (!speakWs || speakWs.readyState !== WebSocket.OPEN) return;
        const targetIPs = getSelectedIPs();
        speakWs.send("__IPS__ " + targetIPs.join(" "));
    }

    // PTT logic stream integration
    const pttBtn = document.getElementById('pttBtn');

	 // Updated PTT logic that completely recreates stream nodes to prevent device corruption
	async function startRecording() {
		if (isRecording) return;
		syncIPSelectionToWS(); 
		
		try {
		    isRecording = true;
		    pttBtn.classList.add('recording');

		    // 1. Always request a fresh media stream from the currently active default system mic
		    micStream = await navigator.mediaDevices.getUserMedia({ 
		        audio: { 
		            sampleRate: 48000, 
		            channelCount: 1,
		            echoCancellation: true,
		            noiseSuppression: true
		        } 
		    });
		    
		    // 2. If an old AudioContext exists, close it out to drop old hardware bindings
		    if (audioCtx) {
		        try { await audioCtx.close(); } catch(e) {}
		    }
		    
		    // 3. Rebuild the Audio Engine entirely for the newly selected device
		    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
		    audioContextInitialized = true;
		    
		    // 4. Bind the new stream to the fresh context nodes
		    const source = audioCtx.createMediaStreamSource(micStream);
		    const processor = audioCtx.createScriptProcessor(4096, 1, 1);
		    
		    processor.onaudioprocess = (e) => {
		        if (!isRecording) return;
		        const inputData = e.inputBuffer.getChannelData(0);
		        const buffer = new ArrayBuffer(inputData.length * 2);
		        const view = new DataView(buffer);
		        let offset = 0;
		        for (let i = 0; i < inputData.length; i++, offset += 2) {
		            let s = Math.max(-1, Math.min(1, inputData[i]));
		            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
		        }
		        if (speakWs && speakWs.readyState === WebSocket.OPEN) {
		            speakWs.send(buffer);
		        }
		    };

		    source.connect(processor);
		    processor.connect(audioCtx.destination);
		    pttBtn.processorRef = processor;
		    pttBtn.sourceRef = source;
		    
		    // 5. Handle cases where the user revokes permission mid-stream 
		    micStream.getTracks()[0].onended = () => {
		        stopRecording();
		    };

		} catch(e) {
		    console.error("Failed to safely initialize new mic device pipeline:", e);
		    isRecording = false;
		    pttBtn.classList.remove('recording');
		}
	}

	function stopRecording() {
		if (!isRecording) return;
		isRecording = false;
		pttBtn.classList.remove('recording');
		
		// Disconnect script processors safely
		if (pttBtn.processorRef) {
		    try { pttBtn.processorRef.disconnect(); } catch(e){}
		}
		if (pttBtn.sourceRef) {
		    try { pttBtn.sourceRef.disconnect(); } catch(e){}
		}
		
		// Stop tracks to let go of hardware control
		if (micStream) {
		    micStream.getTracks().forEach(t => t.stop());
		}
	}
    pttBtn.onmousedown = startRecording;
    pttBtn.onmouseup = stopRecording;
    pttBtn.onmouseleave = stopRecording;

    window.onkeydown = (e) => {
        if (e.code === 'Space' && !spacePressed) {
            e.preventDefault();
            spacePressed = true;
            startRecording();
        }
    };
    window.onkeyup = (e) => {
        if (e.code === 'Space') {
            spacePressed = false;
            stopRecording();
        }
    };

    // Alarm integration with target toggles to remote IPs
    document.getElementById('alarmBtn').onclick = async function() {
        const targets = getSelectedIPs();
        const alarmBtn = this;
        
        // Determine action based on current state toggles
        const path = isAlarmActive ? '/stop_alert' : '/set_alert';
        
        // Dispatch external POST operations
        const requests = targets.map(ip => {
            return fetch(`http://${ip}:6742${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "alert": "alarm" })
            }).catch(e => console.error(`Failed to target client context: ${ip}`, e));
        });

        await Promise.all(requests);

        // Update UI states safely
        if (!isAlarmActive) {
            alarmBtn.classList.add('active');
            isAlarmActive = true;
        } else {
            alarmBtn.classList.remove('active');
            isAlarmActive = false;
        }
    };

    // Cleaned monitoring loops targeting active specs only
    async function checkAlerts() {
        try {
            const res = await fetch('/get_all_alerts');
            const data = await res.json();
            
            data.forEach(item => {
                const ip = item.ip;
                item.alerts.forEach(alertStr => {
                    const uniqueKey = `${ip}_${alertStr}`;
                    if (!activeAlertsMap.has(uniqueKey)) {
                        triggerAlertResponse(ip, alertStr, uniqueKey);
                    }
                });
            });
        } catch(e) {}
    }

    function triggerAlertResponse(ip, alertStr, uniqueKey) {
        const audio = new Audio(`/static/${alertStr}.mp3`);
        audio.loop = true;
        audio.play().catch(()=>{});

        const btnConfig = {};
        btnConfig["DISARM"] = async () => {
            audio.pause();
            activeAlertsMap.delete(uniqueKey);
            try {
                await fetch('/remove_alert', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ ip: ip, alert: alertStr })
                });
            } catch(e) {}
        };

        const modalHandle = showNotification(
            `Alert Raised`,
            `Device IP: ${ip} has triggered code: "${alertStr}"`,
            btnConfig,
            true
        );

        activeAlertsMap.set(uniqueKey, { audio: audio, modal: modalHandle });
    }
</script>
{% endblock %}
