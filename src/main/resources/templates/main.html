{% extends "topbar" %}

{% block head %}
<title>PA System Control Center</title>
<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f6f9;
        user-select: none;
    }

    .dashboard-container {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: calc(100vh - 60px);
        padding: 30px;
        gap: 30px;
        position: relative;
    }

    .column {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100%;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid #e1e4e8;
        border-radius: 20px;
        padding: 24px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .target-panel-column {
        width: 420px;
        max-width: 35vw;
        opacity: 1;
        transform: translateX(0) scale(1);
        transform-origin: right center;
        overflow-y: auto;
    }

    .target-panel-column.hidden {
        width: 0px;
        padding: 0px;
        margin: 0px;
        border: none;
        opacity: 0;
        transform: translateX(50px) scale(0.95);
        pointer-events: none;
        overflow: hidden;
    }

    .search-input-wrapper {
        position: relative;
        width: 100%;
        margin-top: 5px;
    }

    .search-input-wrapper input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid #cccccc;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
    }

    .search-input-wrapper input:focus {
        border-color: #006bb3;
    }

    .search-results-list {
        width: 100%;
        max-height: 160px;
        overflow-y: auto;
        background: #ffffff;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        margin-top: 6px;
    }

    .search-result-item {
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #f0f0f0;
    }

    .search-result-item:last-child {
        border-bottom: none;
    }

    .search-result-item:hover, .search-result-item.highlighted {
        background-color: #eef6fc;
        color: #006bb3;
        font-weight: 600;
    }

    .sending-box-header {
        width: 100%;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #6c757d;
        margin-top: 15px;
        margin-bottom: 5px;
        text-align: left;
    }

    .sending-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        flex: 1;
        overflow-y: auto;
        background: #ffffff;
        border: 1px solid #e1e4e8;
        border-radius: 12px;
        padding: 12px;
        min-height: 180px;
    }

    .sending-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        padding: 10px 12px;
        border-radius: 8px;
    }

    .sending-item-info {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .sending-item-name {
        font-weight: 600;
        font-size: 14px;
        color: #333333;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .sending-item-ip {
        font-size: 12px;
        color: #777777;
    }

    .sending-item-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .action-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s, transform 0.1s;
    }

    .action-btn:active {
        transform: scale(0.95);
    }

    .btn-override {
        background-color: #e9ecef;
    }

    .btn-override.active-override {
        background-color: #ffdddd;
        border: 1px solid #ff4d4d;
    }

    .btn-override img {
        width: 20px;
        height: 20px;
    }

    .btn-remove {
        background-color: #dc3545;
        color: white;
        font-weight: bold;
        font-size: 15px;
    }

    .btn-remove:hover {
        background-color: #bd2130;
    }

    .main-controls-column {
        width: 520px;
        max-width: 90vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        overflow: hidden;
    }

    .p2t {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background-color: rgba(0, 107, 179, 1);
        background-image: url('/static/microphone.svg');
        background-size: 45% 45%;
        background-repeat: no-repeat;
        background-position: center;
        border: 6px solid #ffffff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        outline: none;
    }

    .p2t:active, .p2t.recording {
        background-color: rgba(1, 69, 115, 1);
        transform: scale(0.97);
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    .broadcast-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        padding: 12px 24px;
        border-radius: 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        border: 1px solid #e1e4e8;
        gap: 16px;
    }

    .broadcast-card label.broadcast-label {
        font-weight: 700;
        font-size: 16px;
        color: #2c3e50;
        cursor: pointer;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 54px;
        height: 28px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #ccc;
        transition: .3s;
        border-radius: 34px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 22px;
        width: 22px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .3s;
        border-radius: 50%;
    }

    input:checked + .slider {
        background-color: #006bb3;
    }

    input:checked + .slider:before {
        transform: translateX(26px);
    }

    #alertsContainer {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-top: 5px;
    }

    .emg {
        width: 100px;
        height: 100px;
        border-radius: 24px;
        background-color: rgba(255, 0, 0, 1);
        background-image: url('/static/bell.svg');
        background-size: 50% 50%;
        background-repeat: no-repeat;
        background-position: center;
        transition: background-color 0.2s, transform 0.1s;
        border: none;
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        outline: none;
    }

    .emg:active {
        transform: scale(0.95);
    }

    .emg.active {
        background-color: rgba(0, 255, 0, 1) !important;
    }

    .btn-add-alert {
        width: auto;
        padding: 12px 28px;
        height: 48px;
        border-radius: 24px;
        background-color: #006bb3;
        color: white;
        cursor: pointer;
        border: none;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 4px 12px rgba(0, 107, 179, 0.25);
        transition: background-color 0.2s, transform 0.1s;
        outline: none;
    }

    .btn-add-alert:hover {
        background-color: #00558f;
    }

    .btn-add-alert:active {
        transform: scale(0.97);
    }

    #addAlertModal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        backdrop-filter: blur(4px);
    }

    .box {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
</style>
{% endblock %}

{% block content %}
<div class="dashboard-container">
    <!-- Main Center Controls Column -->
    <div class="column main-controls-column">
        <button class="p2t" id="pttBtn" title="Push To Talk" tabindex="-1"></button>

        <div class="broadcast-card">
            <label for="broadcastToggle" class="broadcast-label">Broadcast All</label>
            <label class="switch">
                <input type="checkbox" id="broadcastToggle" checked onchange="handleBroadcastToggle()" tabindex="-1">
                <span class="slider"></span>
            </label>
        </div>

        <div id="alertsContainer"></div>

        <button class="btn-add-alert" id="addAlertModalBtn" onclick="openAddAlertDialog()" tabindex="-1">+ Add Alert</button>
    </div>

    <!-- Right Target Selection Column -->
    <div id="targetPanel" class="column target-panel-column hidden">
        <div class="search-input-wrapper">
            <input type="text" id="userSearchInput" placeholder="Search connected user/room..." oninput="filterUserSearch()" onkeydown="handleSearchKeyDown(event)">
        </div>
        <div id="searchResultsList" class="search-results-list"></div>

        <div class="sending-box-header">Target Recipients</div>
        <div id="sendingBox" class="sending-box">
            <!-- Dynamic Targeted Users Rendered Here -->
        </div>
    </div>
</div>

<!-- Modal Dialog: Create Alert -->
<div id="addAlertModal" style="display: none;">
    <div class="box" style="text-align: left; width: 340px;">
        <h3 style="margin-top:0;">Add Custom Alert</h3>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 13px; margin-bottom: 4px; font-weight: bold;">Name (a-z ASCII only):</label>
            <input type="text" id="newAlertName" placeholder="e.g. tornado" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" oninput="this.value = this.value.toLowerCase().replace(/[^a-z]/g, '')">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 13px; margin-bottom: 4px; font-weight: bold;">Color:</label>
            <input type="color" id="newAlertColor" value="#ff0000" style="width: 100%; height: 38px; border: none; cursor: pointer; background: none;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 13px; margin-bottom: 4px; font-weight: bold;">Stored Icon:</label>
            <select id="newAlertPreviewSelect" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">-- Select Stored Image --</option>
            </select>
        </div>
        <div style="margin-bottom: 18px; border-top: 1px solid #eee; padding-top: 10px;">
            <label style="display: block; font-size: 13px; margin-bottom: 4px; font-weight: bold;">Upload New Asset:</label>
            <input type="file" id="newAlertFile" accept=".png,.jpg,.jpeg,.svg" style="width: 100%; font-size: 12px; margin-bottom: 6px;">
            <button type="button" onclick="uploadNewAlertFile()" style="padding: 6px 12px; font-size: 12px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px;">Upload</button>
            <span id="uploadStatus" style="font-size: 12px; margin-left: 8px; color: green;"></span>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button type="button" onclick="closeAddAlertDialog()" style="padding: 8px 14px; background: #ccc; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
            <button type="button" onclick="saveNewAlert()" style="padding: 8px 14px; background: #006bb3; color: white; border: none; border-radius: 4px; cursor: pointer;">Save</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let globalUsersList = [];
    let selectedTargetsMap = new Map();
    let clientOverrideStates = new Map();

    let micStream = null;
    let isRecording = false;
    let spacePressed = false;
    let activeAlertsState = {};

    const pttBtn = document.getElementById('pttBtn');

    document.addEventListener('DOMContentLoaded', () => {
        setInterval(fetchUsers, 1000);
        setInterval(pollClientMicStatuses, 2000);

        fetchUsers();
        renderAlertButtons();
        handleBroadcastToggle();
    });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.keyCode === 32) {
            if (e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') {
                e.preventDefault();
                if (document.activeElement && document.activeElement.tagName !== 'INPUT') {
                    document.activeElement.blur();
                }
                if (!spacePressed) {
                    spacePressed = true;
                    startRecording();
                }
            }
        }
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.keyCode === 32) {
            if (e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') {
                e.preventDefault();
                spacePressed = false;
                stopRecording();
            }
        }
    }, { passive: false });

    async function startRecording() {
        if (isRecording) return;

        syncIPSelectionToWS();

        try {
            isRecording = true;
            pttBtn.classList.add('recording');

            micStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    sampleRate: 48000,
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true
                }
            });

            let audioCtx = window.getAudioCtx ? window.getAudioCtx() : null;
            if (!audioCtx || audioCtx.state === 'closed') {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            const source = audioCtx.createMediaStreamSource(micStream);
            const processor = audioCtx.createScriptProcessor(4096, 1, 1);

            processor.onaudioprocess = (e) => {
                if (!isRecording) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const buffer = new ArrayBuffer(inputData.length * 2);
                const view = new DataView(buffer);
                let offset = 0;
                for (let i = 0; i < inputData.length; i++, offset += 2) {
                    let s = Math.max(-1, Math.min(1, inputData[i]));
                    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                }
                const speakWs = window.getSpeakWs ? window.getSpeakWs() : null;
                if (speakWs && speakWs.readyState === WebSocket.OPEN) {
                    speakWs.send(buffer);
                }
            };

            source.connect(processor);
            processor.connect(audioCtx.destination);

            pttBtn.processorRef = processor;
            pttBtn.sourceRef = source;

            micStream.getTracks()[0].onended = () => { stopRecording(); };
        } catch(e) {
            isRecording = false;
            pttBtn.classList.remove('recording');
        }
    }

    function stopRecording() {
        if (!isRecording) return;
        isRecording = false;
        pttBtn.classList.remove('recording');

        if (pttBtn.processorRef) { try { pttBtn.processorRef.disconnect(); } catch(e){} }
        if (pttBtn.sourceRef) { try { pttBtn.sourceRef.disconnect(); } catch(e){} }
        if (micStream) { micStream.getTracks().forEach(t => t.stop()); }
    }

    if (pttBtn) {
        pttBtn.onmousedown = startRecording;
        pttBtn.onmouseup = stopRecording;
        pttBtn.onmouseleave = stopRecording;
    }

    async function fetchUsers() {
        try {
            const res = await fetch('/get_users');
            globalUsersList = await res.json();
            
            const onlineIPs = new Set(globalUsersList.map(u => u.ip));
            let selectionChanged = false;

            selectedTargetsMap.forEach((_, ip) => {
                if (!onlineIPs.has(ip)) {
                    selectedTargetsMap.delete(ip);
                    clientOverrideStates.delete(ip);
                    selectionChanged = true;
                }
            });

            if (selectionChanged) {
                syncIPSelectionToWS();
            }

            filterUserSearch();
            renderSendingBox();
        } catch(e) {}
    }

    function handleBroadcastToggle() {
        const toggle = document.getElementById('broadcastToggle');
        if (!toggle) return;
        const isBroadcast = toggle.checked;
        const targetPanel = document.getElementById('targetPanel');
        
        if (isBroadcast) {
            targetPanel.classList.add('hidden');
        } else {
            targetPanel.classList.remove('hidden');
        }
        syncIPSelectionToWS();
    }

    function filterUserSearch() {
        const searchInput = document.getElementById('userSearchInput');
        if (!searchInput) return;
        const query = searchInput.value.toLowerCase().trim();
        const resultsContainer = document.getElementById('searchResultsList');
        if (!resultsContainer) return;
        resultsContainer.innerHTML = '';

        if (!query) return;

        const filtered = globalUsersList.filter(u => 
            !selectedTargetsMap.has(u.ip) && 
            (u.name.toLowerCase().includes(query) || u.ip.includes(query))
        );

        filtered.forEach((user, idx) => {
            const item = document.createElement('div');
            item.className = 'search-result-item' + (idx === 0 ? ' highlighted' : '');
            item.innerHTML = `<span>${user.name}</span> <small style="color:#888;">${user.ip}</small>`;
            item.onclick = () => addTargetUser(user);
            resultsContainer.appendChild(item);
        });
    }

    function handleSearchKeyDown(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const topResult = document.querySelector('#searchResultsList .search-result-item');
            if (topResult) {
                topResult.click();
            }
        }
    }

    function addTargetUser(user) {
        selectedTargetsMap.set(user.ip, user);
        const searchInput = document.getElementById('userSearchInput');
        if (searchInput) searchInput.value = '';
        filterUserSearch();
        renderSendingBox();
        syncIPSelectionToWS();
    }

    function removeTargetUser(ip) {
        selectedTargetsMap.delete(ip);
        renderSendingBox();
        filterUserSearch();
        syncIPSelectionToWS();
    }

    function renderSendingBox() {
        const container = document.getElementById('sendingBox');
        if (!container) return;
        container.innerHTML = '';

        if (selectedTargetsMap.size === 0) {
            container.innerHTML = `<div style="text-align:center; color:#999; font-size:13px; margin-top:40px;">No individual targets added.<br>Search above to add recipients.</div>`;
            return;
        }

        selectedTargetsMap.forEach((user, ip) => {
            const isOverridden = !!clientOverrideStates.get(ip);
            const item = document.createElement('div');
            item.className = 'sending-item';
            
            const iconSvg = isOverridden ? '/static/mic-normal.svg' : '/static/mic-override.svg';
            const titleTooltip = isOverridden ? 'Switch to Normal Mode' : 'Override Remote Mic';

            item.innerHTML = `
                <div class="sending-item-info">
                    <span class="sending-item-name">${user.name}</span>
                    <span class="sending-item-ip">${user.ip}</span>
                </div>
                <div class="sending-item-actions">
                    <button class="action-btn btn-override ${isOverridden ? 'active-override' : ''}" title="${titleTooltip}" onclick="toggleMicOverride('${ip}')" tabindex="-1">
                        <img src="${iconSvg}" alt="override-toggle">
                    </button>
                    <button class="action-btn btn-remove" title="Remove Target" onclick="removeTargetUser('${ip}')" tabindex="-1">X</button>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function getSelectedIPs() {
        const toggle = document.getElementById('broadcastToggle');
        const isBroadcast = toggle ? toggle.checked : true;
        if (isBroadcast) {
            return globalUsersList.map(u => u.ip);
        }
        return Array.from(selectedTargetsMap.keys());
    }

    function syncIPSelectionToWS() {
        if (window.sendIPSelection) {
            window.sendIPSelection(getSelectedIPs());
        }
    }

    async function toggleMicOverride(ip) {
        const currentOverride = !!clientOverrideStates.get(ip);
        const endpoint = currentOverride ? '/mic_normal' : '/mic_override';

        try {
            await fetch(`http://${ip}:6742${endpoint}`, { method: 'POST' });
            clientOverrideStates.set(ip, !currentOverride);
            renderSendingBox();
        } catch(e) {
            console.error(`Failed to dispatch mic override command to ${ip}`, e);
        }
    }

    async function pollClientMicStatuses() {
        selectedTargetsMap.forEach(async (user, ip) => {
            try {
                const res = await fetch(`http://${ip}:6742/mic_status`, { signal: AbortSignal.timeout(1500) });
                if (res.ok) {
                    const data = await res.json();
                    const isOverride = data.status === 'override';
                    if (clientOverrideStates.get(ip) !== isOverride) {
                        clientOverrideStates.set(ip, isOverride);
                        renderSendingBox();
                    }
                }
            } catch(e) {}
        });
    }

    function getCustomAlerts() {
        try {
            const data = localStorage.getItem('pa_custom_alerts');
            return data ? JSON.parse(data) : [];
        } catch(e) { return []; }
    }

    function saveCustomAlerts(alerts) {
        localStorage.setItem('pa_custom_alerts', JSON.stringify(alerts));
    }

    function renderAlertButtons() {
        const container = document.getElementById('alertsContainer');
        if (!container) return;
        container.innerHTML = '';

        const defaultWrapper = document.createElement('div');
        defaultWrapper.style.position = 'relative';

        const alarmBtn = document.createElement('button');
        alarmBtn.className = 'emg' + (activeAlertsState['alarm'] ? ' active' : '');
        alarmBtn.style.backgroundColor = 'rgba(255, 0, 0, 1)';
        alarmBtn.style.backgroundImage = "url('/static/bell.svg')";
        alarmBtn.tabIndex = -1;
        alarmBtn.onclick = () => toggleAlert('alarm');
        defaultWrapper.appendChild(alarmBtn);
        container.appendChild(defaultWrapper);

        getCustomAlerts().forEach((alertObj, index) => {
            const wrapper = document.createElement('div');
            wrapper.style.position = 'relative';

            const btn = document.createElement('button');
            btn.className = 'emg' + (activeAlertsState[alertObj.name] ? ' active' : '');
            btn.style.backgroundColor = alertObj.color || 'rgba(255, 0, 0, 1)';
            btn.style.backgroundImage = alertObj.icon ? `url('/file_storage/stored/${alertObj.icon}')` : "url('/static/bell.svg')";
            btn.tabIndex = -1;
            btn.onclick = () => toggleAlert(alertObj.name);
            wrapper.appendChild(btn);

            const delBtn = document.createElement('button');
            delBtn.innerText = '×';
            delBtn.style.cssText = 'position:absolute; top:-6px; right:-6px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.75); color:white; border:none; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;';
            delBtn.tabIndex = -1;
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteCustomAlert(index);
            };
            wrapper.appendChild(delBtn);
            container.appendChild(wrapper);
        });
    }

    async function toggleAlert(alertName) {
        const targets = getSelectedIPs();
        const isActive = !!activeAlertsState[alertName];
        const path = isActive ? '/stop_alert' : '/set_alert';

        const requests = targets.map(ip => {
            return fetch(`http://${ip}:6742${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "alert": alertName })
            }).catch(e => console.error(`Failed to dispatch alert to IP: ${ip}`, e));
        });

        await Promise.all(requests);
        activeAlertsState[alertName] = !isActive;
        renderAlertButtons();
    }

    function deleteCustomAlert(index) {
        let customAlerts = getCustomAlerts();
        const removed = customAlerts.splice(index, 1);
        if (removed && removed.length > 0) {
            delete activeAlertsState[removed[0].name];
        }
        saveCustomAlerts(customAlerts);
        renderAlertButtons();
    }

    function openAddAlertDialog() {
        const modal = document.getElementById('addAlertModal');
        if (modal) {
            document.getElementById('newAlertName').value = '';
            document.getElementById('newAlertColor').value = '#ff0000';
            document.getElementById('newAlertFile').value = '';
            document.getElementById('uploadStatus').innerText = '';
            loadStoredFilesForDropdown();
            modal.style.display = 'flex';
        }
    }

    function closeAddAlertDialog() {
        const modal = document.getElementById('addAlertModal');
        if (modal) modal.style.display = 'none';
    }

    async function loadStoredFilesForDropdown(preselect = '') {
        const select = document.getElementById('newAlertPreviewSelect');
        if (!select) return;
        select.innerHTML = '<option value="">-- Select Stored Image --</option>';
        try {
            const res = await fetch('/file_storage/list-stored');
            if (res.ok) {
                const files = await res.json();
                files.forEach(filename => {
                    const lower = filename.toLowerCase();
                    if (['.png', '.jpg', '.jpeg', '.svg'].some(ext => lower.endsWith(ext))) {
                        const opt = document.createElement('option');
                        opt.value = filename;
                        opt.innerText = filename;
                        if (filename === preselect) opt.selected = true;
                        select.appendChild(opt);
                    }
                });
            }
        } catch(e) {}
    }

    async function uploadNewAlertFile() {
        const fileInput = document.getElementById('newAlertFile');
        const statusSpan = document.getElementById('uploadStatus');
        if (!fileInput || !fileInput.files || fileInput.files.length === 0) return;

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('file', file);
        formData.append('filename', file.name);

        try {
            statusSpan.innerText = "Uploading...";
            const res = await fetch('/file_storage/upload-stored', { method: 'POST', body: formData });
            if (res.ok) {
                statusSpan.innerText = "Uploaded!";
                fileInput.value = '';
                await loadStoredFilesForDropdown(file.name);
            } else { statusSpan.innerText = "Failed."; }
        } catch(e) { statusSpan.innerText = "Error."; }
    }

    function saveNewAlert() {
        const nameInput = document.getElementById('newAlertName').value.trim();
        const colorInput = document.getElementById('newAlertColor').value;
        const previewSelect = document.getElementById('newAlertPreviewSelect').value;

        if (!nameInput || !/^[a-z]+$/.test(nameInput)) {
            alert("Please enter a valid alert name (lowercase ASCII only).");
            return;
        }

        let customAlerts = getCustomAlerts();
        if (nameInput === 'alarm' || customAlerts.some(a => a.name === nameInput)) {
            alert("An alert with this identifier already exists.");
            return;
        }

        customAlerts.push({ name: nameInput, color: colorInput, icon: previewSelect || '' });
        saveCustomAlerts(customAlerts);
        closeAddAlertDialog();
        renderAlertButtons();
    }
</script>
{% endblock %}
