{% extends "topbar" %}

{% block head %}
<title>PA System</title>
<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        margin: 0;
        padding-top: 10px;
        font-family: sans-serif;
        background-color: #f0f0f0;
        background-size: 100% 100%;
        background-repeat: no-repeat;
    }
    .cont {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        margin-top: 10px; 
    }
    .cont .emg {
        width: 100px;
        height: 100px;
        border-radius: 25px;
        background-color: rgba(255, 0 , 0, 1);
        background-image: url('/static/bell.svg');
        background-size: 50% 50%;
        background-repeat: no-repeat;
        background-position: center;
        transition: background-color 0.2s;
        border: none;
        cursor: pointer;
    }
    .cont .emg.active {
        background-color: rgba(0, 255, 0, 1) !important;
    }
    .cont .p2t {
        width: 200px;
        height: 200px;
        border-radius: 50px;
        background-color: rgba(0, 107, 179, 1);
        background-image: url('/static/microphone.svg');
        background-size: 50% 50%;
        background-repeat: no-repeat;
        background-position: center;
        border: none;
        cursor: pointer;
    }
    .cont .p2t:active, .cont .p2t.recording {
        background-color: rgba(1, 69, 115, 1);
    }
    .cont .btn-row {
        display: flex;
        flex-direction: row;
        gap: 10px;
    }
    .cont .btn-row .btn {
        border-radius: 12.5px;
        width: 50px;
        height: 50px;
        background-color: rgba(250, 211, 54, 1);
        border: none;
        cursor: pointer;
        font-weight: bold;
    }
    .cont .btn-row .btn:active {
        background-color: rgba(171, 145, 41, 1);
        background-image: url('issy.png');
        background-size: 50% 50%;
    }
    #audioOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
    }
    #audioOverlay .box {
        background: white;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
    }
    #audioOverlay button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
	
	#speakerContainer {
		position: fixed;
		bottom: 20px;
		left: 50%;
		transform: translateX(-50%);
		display: flex;
		flex-direction: row;
		flex-wrap: wrap;
		gap: 10px;
		justify-content: center;
		align-items: center;
		max-width: 80%;
		z-index: 9999;
		box-sizing: border-box;
	}

	.speakerTag {
		display: flex;
		flex-direction: row;
		align-items: center;
		gap: 8px;
		padding: 6px 12px;
		border-radius: 10px;
		background: white;
		color: black;
		font-size: 14px;
		box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
		white-space: nowrap;
		box-sizing: border-box;
	}

	.speakerTag img {
		width: 18px;
		height: 18px;
		flex-shrink: 0;
	}
    .drp select {
        padding: 8px;
        border-radius: 5px;
        font-size: 14px;
        min-width: 160px;
    }
    .dropdown-wrapper {
        margin: 4px 0;
    }
</style>
{% endblock %}

{% block content %}
<div id="audioOverlay">
    <div class="box">
        <h2>Enable Audio</h2>
        <p>Click to allow sound + voice</p>
        <button id="enableAudioBtn">Enable</button>
    </div>
</div>

<div class="cont">
    <button class="p2t" id="pttBtn"></button>
    <div class="drp" id="userContainer"></div>
    
    <div class="btn-row">
        <button class="btn" id="addBtn" onclick="addUserDropdown()">[+]</button>
        <button class="btn" onclick="removeUserDropdown()">[-]</button>
    </div>
    
    <br>
    
    <div id="alertsContainer" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; max-width: 400px; margin-bottom: 5px;"></div>
    <button class="btn" id="addAlertModalBtn" onclick="openAddAlertDialog()" style="width: auto; padding: 0 15px; height: 40px; border-radius: 20px; background-color: #006bb3; color: white; cursor: pointer; border: none; font-weight: bold;">+ Add Alert</button>
</div>

<!-- Add Alert Dialog Modal -->
<div id="addAlertModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 99999;">
    <div class="box" style="background: white; padding: 30px; border-radius: 12px; text-align: left; width: 320px;">
        <h3>Add New Alert</h3>
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold;">Name (lowercase ASCII only):</label>
            <input type="text" id="newAlertName" placeholder="e.g. tornado" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;" oninput="this.value = this.value.toLowerCase().replace(/[^a-z]/g, '')">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold;">Color:</label>
            <input type="color" id="newAlertColor" value="#ff0000" style="width: 100%; height: 40px; border: none; cursor: pointer; background: none;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold;">Preview / Icon (Stored Files):</label>
            <select id="newAlertPreviewSelect" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px;">
                <option value="">-- Select Stored Image --</option>
            </select>
        </div>
        <div style="margin-bottom: 20px; border-top: 1px solid #eee; padding-top: 10px;">
            <label style="display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold;">Upload New Image:</label>
            <input type="file" id="newAlertFile" accept=".png,.jpg,.jpeg,.svg" style="width: 100%; font-size: 12px; margin-bottom: 5px;">
            <button type="button" onclick="uploadNewAlertFile()" style="padding: 6px 12px; font-size: 12px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px;">Upload File</button>
            <span id="uploadStatus" style="font-size: 12px; margin-left: 8px; color: green;"></span>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" onclick="closeAddAlertDialog()" style="padding: 8px 16px; background: #ccc; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
            <button type="button" onclick="saveNewAlert()" style="padding: 8px 16px; background: #006bb3; color: white; border: none; border-radius: 4px; cursor: pointer;">Save</button>
        </div>
    </div>
</div>

<div id="speakerContainer"></div>
{% endblock %}

{% block scripts %}
<script src="/static/notifications.js"></script>
<script>
    let globalUsersList = [];
    let activeAlertsMap = new Map();
    let audioContextInitialized = false;
    let audioCtx = null;
    let audioIoWs = null;
    let speakWs = null;
    let micStream = null;
    let isRecording = false;
    let spacePressed = false;
    
    // Track active state per alert name
    let activeAlertsState = {};

    // Click trigger setup 
    document.getElementById('enableAudioBtn').onclick = async () => {
        document.getElementById('audioOverlay').style.display = 'none';
        initAudioEngine();
        initWebSockets();
        
        setInterval(fetchUsers, 1000);
        setInterval(checkAlerts, 1000);
        
        fetchUsers();
        renderAlertButtons();
    };

    function initAudioEngine() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
        audioContextInitialized = true;
    }

    function initWebSockets() {
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const host = window.location.host;

        function connectAudioIo() {
            audioIoWs = new WebSocket(protocol + host + '/audio_io');
            audioIoWs.binaryType = 'arraybuffer';
            
            audioIoWs.onopen = () => {
                audioIoWs.send("GET_AUDIO_STREAM");
            };

            audioIoWs.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    try {
                        const activeSpeakers = JSON.parse(event.data);
                        renderSpeakers(activeSpeakers);
                    } catch(e) {}
                } else {
                    playRawBytes(event.data);
                }
            };

            audioIoWs.onclose = () => {
                handleWsDisconnectUi();
                setTimeout(connectAudioIo, 2000);
            };
            
            audioIoWs.onerror = () => {
                audioIoWs.close();
            };
        }

        function connectSpeak() {
            speakWs = new WebSocket(protocol + host + '/speak');
            
            speakWs.onclose = () => {
                handleWsDisconnectUi();
                setTimeout(connectSpeak, 2000);
            };

            speakWs.onerror = () => {
                speakWs.close();
            };
        }

        connectAudioIo();
        connectSpeak();
    }

    function handleWsDisconnectUi() {
        const container = document.getElementById('speakerContainer');
        if (container) container.innerHTML = '';

        const selects = document.querySelectorAll('#userContainer select');
        selects.forEach(select => {
            if (select.options.length > 0 && !select.querySelector('option[value="--"]')) {
                const fallbackOpt = document.createElement('option');
                fallbackOpt.value = "--";
                fallbackOpt.innerText = "--";
                select.insertBefore(fallbackOpt, select.firstChild);
                select.value = "--";
            }
        });
    }

	let pcmWorkletNode = null;

	async function initAudioEngine() {
		if (!audioCtx || audioCtx.state === 'closed') {
		    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
		}
		
		if (audioCtx.state === 'suspended') {
		    await audioCtx.resume();
		}

		try {
		    await audioCtx.audioWorklet.addModule('/static/pcm-processor.js');
		} catch(e) {}
		
		pcmWorkletNode = new AudioWorkletNode(audioCtx, 'pcm-processor');
		pcmWorkletNode.connect(audioCtx.destination);
		
		audioContextInitialized = true;
	}

    function playRawBytes(arrayBuffer) {
        if (!audioContextInitialized || !audioCtx || !pcmWorkletNode) return;
        if (arrayBuffer.byteLength !== 960) {}
        pcmWorkletNode.port.postMessage(arrayBuffer, [arrayBuffer]);
    }

    function renderSpeakers(speakersList) {
        const container = document.getElementById('speakerContainer');
        container.innerHTML = '';
        speakersList.forEach(speaker => {
            const tag = document.createElement('div');
            tag.className = 'speakerTag';
            tag.innerHTML = `<img src="/static/speaker.svg" alt="spk"> <span>${speaker.name || speaker.ip}</span>`;
            container.appendChild(tag);
        });
    }

    async function fetchUsers() {
        try {
            const res = await fetch('/get_users');
            globalUsersList = await res.json();
            updateDropdownOptions();
        } catch(e) {}
    }

    function addUserDropdown() {
        const container = document.getElementById('userContainer');
        const wrappers = container.getElementsByClassName('dropdown-wrapper');
        
        if (wrappers.length === 1) {
            const firstSelect = wrappers[0].querySelector('select');
            if (firstSelect && firstSelect.value === 'BROADCAST') return;
        }

        const div = document.createElement('div');
        div.className = 'dropdown-wrapper';
        const select = document.createElement('select');
        select.onchange = handleDropdownSelectionChange;
        div.appendChild(select);
        container.appendChild(div);
        
        updateDropdownOptions();
    }

    function removeUserDropdown() {
        const container = document.getElementById('userContainer');
        if (container.lastChild) {
            container.removeChild(container.lastChild);
            updateDropdownOptions();
            syncIPSelectionToWS();
        }
    }

    function updateDropdownOptions() {
        const container = document.getElementById('userContainer');
        const wrappers = container.getElementsByClassName('dropdown-wrapper');
        
        if (wrappers.length === 0) {
            const div = document.createElement('div');
            div.className = 'dropdown-wrapper';
            const select = document.createElement('select');
            select.onchange = handleDropdownSelectionChange;
            div.appendChild(select);
            container.appendChild(div);
        }

        const totalDropdowns = wrappers.length;
        const currentSelections = Array.from(wrappers).map(w => w.querySelector('select').value);

        Array.from(wrappers).forEach((wrapper, idx) => {
            const select = wrapper.querySelector('select');
            const previousVal = currentSelections[idx] || '';
            select.innerHTML = '';

            if (totalDropdowns === 1) {
                const opt = document.createElement('option');
                opt.value = 'BROADCAST';
                opt.innerText = 'BROADCAST';
                select.appendChild(opt);
            }

            globalUsersList.forEach(user => {
                const isSelectedElsewhere = currentSelections.some((val, sIdx) => sIdx !== idx && val === user.ip);
                if (!isSelectedElsewhere) {
                    const opt = document.createElement('option');
                    opt.value = user.ip;
                    opt.innerText = user.name;
                    select.appendChild(opt);
                }
            });

            if (previousVal && select.querySelector(`option[value="${previousVal}"]`)) {
                select.value = previousVal;
            } else if (select.options.length > 0) {
                select.selectedIndex = 0;
            }
        });
    }

    function handleDropdownSelectionChange() {
        updateDropdownOptions();
        syncIPSelectionToWS();
    }

    function getSelectedIPs() {
        const selects = document.querySelectorAll('#userContainer select');
        let ips = [];
        selects.forEach(sel => {
            if (sel.value === 'BROADCAST') {
                ips = globalUsersList.map(u => u.ip);
            } else if (sel.value && sel.value !== "--") {
                ips.push(sel.value);
            }
        });
        return [...new Set(ips)];
    }

    function syncIPSelectionToWS() {
        if (!speakWs || speakWs.readyState !== WebSocket.OPEN) return;
        const targetIPs = getSelectedIPs();
        speakWs.send("__IPS__ " + targetIPs.join(" "));
    }

    const pttBtn = document.getElementById('pttBtn');

	async function startRecording() {
		if (isRecording) return;
		syncIPSelectionToWS(); 
		
		try {
		    isRecording = true;
		    pttBtn.classList.add('recording');

		    micStream = await navigator.mediaDevices.getUserMedia({ 
		        audio: { 
		            sampleRate: 48000, 
		            channelCount: 1,
		            echoCancellation: true,
		            noiseSuppression: true
		        } 
		    });
		    
		    if (!audioCtx || audioCtx.state === 'closed') {
		        await initAudioEngine();
		    }
		    
		    const source = audioCtx.createMediaStreamSource(micStream);
		    const processor = audioCtx.createScriptProcessor(4096, 1, 1);
		    
		    processor.onaudioprocess = (e) => {
		        if (!isRecording) return;
		        const inputData = e.inputBuffer.getChannelData(0);
		        const buffer = new ArrayBuffer(inputData.length * 2);
		        const view = new DataView(buffer);
		        let offset = 0;
		        for (let i = 0; i < inputData.length; i++, offset += 2) {
		            let s = Math.max(-1, Math.min(1, inputData[i]));
		            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
		        }
		        if (speakWs && speakWs.readyState === WebSocket.OPEN) {
		            speakWs.send(buffer);
		        }
		    };

		    source.connect(processor);
		    processor.connect(audioCtx.destination); 
		    
		    pttBtn.processorRef = processor;
		    pttBtn.sourceRef = source;
		    
		    micStream.getTracks()[0].onended = () => {
		        stopRecording();
		    };

		} catch(e) {
		    isRecording = false;
		    pttBtn.classList.remove('recording');
		}
	}

	function stopRecording() {
		if (!isRecording) return;
		isRecording = false;
		pttBtn.classList.remove('recording');
		
		if (pttBtn.processorRef) {
		    try { pttBtn.processorRef.disconnect(); } catch(e){}
		}
		if (pttBtn.sourceRef) {
		    try { pttBtn.sourceRef.disconnect(); } catch(e){}
		}
		
		if (micStream) {
		    micStream.getTracks().forEach(t => t.stop());
		}
	}

    pttBtn.onmousedown = startRecording;
    pttBtn.onmouseup = stopRecording;
    pttBtn.onmouseleave = stopRecording;

    window.onkeydown = (e) => {
        if (e.code === 'Space' && !spacePressed) {
            e.preventDefault();
            spacePressed = true;
            startRecording();
        }
    };
    window.onkeyup = (e) => {
        if (e.code === 'Space') {
            spacePressed = false;
            stopRecording();
        }
    };

    // --- Custom Alerts Management & Rendering ---

    function getCustomAlerts() {
        try {
            const data = localStorage.getItem('pa_custom_alerts');
            return data ? JSON.parse(data) : [];
        } catch(e) {
            return [];
        }
    }

    function saveCustomAlerts(alerts) {
        localStorage.setItem('pa_custom_alerts', JSON.stringify(alerts));
    }

    function renderAlertButtons() {
        const container = document.getElementById('alertsContainer');
        if (!container) return;
        container.innerHTML = '';

        // 1. Default Alarm Button
        const defaultWrapper = document.createElement('div');
        defaultWrapper.style.position = 'relative';
        defaultWrapper.style.display = 'inline-block';

        const alarmBtn = document.createElement('button');
        alarmBtn.className = 'emg';
        if (activeAlertsState['alarm']) {
            alarmBtn.classList.add('active');
        }
        alarmBtn.style.backgroundColor = 'rgba(255, 0, 0, 1)';
        alarmBtn.style.backgroundImage = "url('/static/bell.svg')";
        alarmBtn.onclick = () => toggleAlert('alarm');
        defaultWrapper.appendChild(alarmBtn);
        container.appendChild(defaultWrapper);

        // 2. Custom Alert Buttons
        const customAlerts = getCustomAlerts();
        customAlerts.forEach((alertObj, index) => {
            const wrapper = document.createElement('div');
            wrapper.style.position = 'relative';
            wrapper.style.display = 'inline-block';

            const btn = document.createElement('button');
            btn.className = 'emg';
            if (activeAlertsState[alertObj.name]) {
                btn.classList.add('active');
            }
            btn.style.backgroundColor = alertObj.color || 'rgba(255, 0, 0, 1)';
            if (alertObj.icon) {
                btn.style.backgroundImage = `url('/file_storage/stored/${alertObj.icon}')`;
            } else {
                btn.style.backgroundImage = "url('/static/bell.svg')";
            }
            btn.onclick = () => toggleAlert(alertObj.name);
            wrapper.appendChild(btn);

            // Tiny (x) delete button on top
            const delBtn = document.createElement('button');
            delBtn.innerText = 'x';
            delBtn.style.position = 'absolute';
            delBtn.style.top = '2px';
            delBtn.style.right = '2px';
            delBtn.style.width = '20px';
            delBtn.style.height = '20px';
            delBtn.style.borderRadius = '50%';
            delBtn.style.background = 'rgba(0,0,0,0.6)';
            delBtn.style.color = 'white';
            delBtn.style.border = 'none';
            delBtn.style.cursor = 'pointer';
            delBtn.style.fontSize = '12px';
            delBtn.style.display = 'flex';
            delBtn.style.alignItems = 'center';
            delBtn.style.justifyContent = 'center';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteCustomAlert(index);
            };
            wrapper.appendChild(delBtn);

            container.appendChild(wrapper);
        });
    }

    async function toggleAlert(alertName) {
        const targets = getSelectedIPs();
        const isActive = !!activeAlertsState[alertName];
        const path = isActive ? '/stop_alert' : '/set_alert';

        const requests = targets.map(ip => {
            return fetch(`http://${ip}:6742${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "alert": alertName })
            }).catch(e => console.error(`Failed to target client context: ${ip}`, e));
        });

        await Promise.all(requests);

        activeAlertsState[alertName] = !isActive;
        renderAlertButtons();
    }

    function deleteCustomAlert(index) {
        let customAlerts = getCustomAlerts();
        const removed = customAlerts.splice(index, 1);
        if (removed && removed.length > 0) {
            const name = removed[0].name;
            if (activeAlertsState[name]) {
                delete activeAlertsState[name];
            }
        }
        saveCustomAlerts(customAlerts);
        renderAlertButtons();
    }

    function openAddAlertDialog() {
        document.getElementById('newAlertName').value = '';
        document.getElementById('newAlertColor').value = '#ff0000';
        document.getElementById('newAlertFile').value = '';
        document.getElementById('uploadStatus').innerText = '';
        loadStoredFilesForDropdown();
        document.getElementById('addAlertModal').style.display = 'flex';
    }

    function closeAddAlertDialog() {
        document.getElementById('addAlertModal').style.display = 'none';
    }

    async function loadStoredFilesForDropdown(preselect = '') {
        const select = document.getElementById('newAlertPreviewSelect');
        select.innerHTML = '<option value="">-- Select Stored Image --</option>';
        try {
            const res = await fetch('/list-stored');
            if (res.ok) {
                const files = await res.json();
                files.forEach(filename => {
                    const lower = filename.toLowerCase();
                    if (lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.svg')) {
                        const opt = document.createElement('option');
                        opt.value = filename;
                        opt.innerText = filename;
                        if (filename === preselect) {
                            opt.selected = true;
                        }
                        select.appendChild(opt);
                    }
                });
            }
        } catch(e) {}
    }

    async function uploadNewAlertFile() {
        const fileInput = document.getElementById('newAlertFile');
        const statusSpan = document.getElementById('uploadStatus');
        if (!fileInput.files || fileInput.files.length === 0) {
            alert("Please select a file to upload.");
            return;
        }
        const file = fileInput.files[0];
        const filename = file.name;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('filename', filename);

        try {
            statusSpan.innerText = "Uploading...";
            const res = await fetch('/file_storage/upload-stored', {
                method: 'POST',
                body: formData
            });
            if (res.ok) {
                statusSpan.innerText = "Uploaded successfully!";
                fileInput.value = '';
                await loadStoredFilesForDropdown(filename);
            } else {
                statusSpan.innerText = "Upload failed.";
            }
        } catch(e) {
            statusSpan.innerText = "Error uploading.";
        }
    }

    function saveNewAlert() {
        const nameInput = document.getElementById('newAlertName').value.trim();
        const colorInput = document.getElementById('newAlertColor').value;
        const previewSelect = document.getElementById('newAlertPreviewSelect').value;

        if (!nameInput) {
            alert("Please enter a name for the alert.");
            return;
        }
        if (!/^[a-z]+$/.test(nameInput)) {
            alert("Alert name must contain lowercase ASCII letters (a-z) only.");
            return;
        }

        let customAlerts = getCustomAlerts();
        if (nameInput === 'alarm' || customAlerts.some(a => a.name === nameInput)) {
            alert("An alert with this name already exists.");
            return;
        }

        customAlerts.push({
            name: nameInput,
            color: colorInput,
            icon: previewSelect || ''
        });

        saveCustomAlerts(customAlerts);
        closeAddAlertDialog();
        renderAlertButtons();
    }

    // Monitoring loops
    async function checkAlerts() {
        try {
            const res = await fetch('/get_all_alerts');
            const data = await res.json();
            
            data.forEach(item => {
                const ip = item.ip;
                item.alerts.forEach(alertStr => {
                    const uniqueKey = `${ip}_${alertStr}`;
                    if (!activeAlertsMap.has(uniqueKey)) {
                        triggerAlertResponse(ip, alertStr, uniqueKey);
                    }
                });
            });
        } catch(e) {}
    }

    function triggerAlertResponse(ip, alertStr, uniqueKey) {
        let audio = new Audio(`/static/${alertStr}.mp3`);
        audio.loop = true;
        audio.play().catch(()=>{
            audio = new Audio(`/stored/${alertStr}.mp3`);
            audio.loop = true;
            audio.play().catch(()=>{});
        });

        const btnConfig = {};
        btnConfig["DISARM"] = async () => {
            audio.pause();
            activeAlertsMap.delete(uniqueKey);
            try {
                await fetch('/remove_client_alert', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ ip: ip, alert: alertStr })
                });
            } catch(e) {}
        };

        const modalHandle = showNotification(
            `Alert Raised`,
            `Device IP: ${ip} has triggered code: "${alertStr}"`,
            btnConfig,
            true
        );

        activeAlertsMap.set(uniqueKey, { audio: audio, modal: modalHandle });
    }
</script>
{% endblock %}
