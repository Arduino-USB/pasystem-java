{% extends "topbar" %}

{% block head %}
<title>System Time & Bell Manager</title>

<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f6f9;
        overflow-x: hidden;
    }

    .time-manager-container {
        max-width: 1250px;
        margin: 20px auto;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    h3 {
        color: #2c3e50;
        font-size: 20px;
        margin: 0 0 10px 0;
        font-weight: 700;
        letter-spacing: -0.3px;
    }

    /* System Time Setup Box */
    #timeContainer {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #e1e4e8;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        backdrop-filter: blur(10px);
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
    }

    /* Standard Inputs & Selects Styling */
    #timeContainer input, #timeContainer select, 
    .time-input-row input, .tz-search-box {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #cccccc;
        font-size: 14px;
        background: white;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    #timeContainer input:focus, #timeContainer select:focus, 
    .time-input-row input:focus, .tz-search-box:focus {
        border-color: #006bb3;
        box-shadow: 0 0 0 3px rgba(0, 107, 179, 0.1);
    }

    .time-input-row input {
        width: 100%;
    }

    .tz-search-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 220px;
    }

    /* Unified Button Styles */
    button {
        padding: 10px 16px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        font-size: 14px;
        font-weight: 600;
        color: #2c3e50;
        transition: background-color 0.2s, transform 0.1s, border-color 0.2s;
    }

    button:hover {
        background: #f0f2f5;
        border-color: #bcbcbc;
    }

    button:active {
        transform: scale(0.98);
    }

    .btn-primary {
        background: #006bb3 !important;
        color: white !important;
        border: none !important;
        box-shadow: 0 4px 12px rgba(0, 107, 179, 0.2);
    }

    .btn-primary:hover {
        background: #00558f !important;
    }

    .btn-success {
        font-weight: bold;
        background: #28a745 !important;
        color: white !important;
        border: none !important;
        padding: 12px 24px;
        border-radius: 24px;
        box-shadow: 0 4px 12px rgba(40, 167, 69, 0.25);
    }

    .btn-success:hover {
        background: #218838 !important;
    }

    /* 4-Column Grid Setup for Bell Schedules */
    .bell-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        width: 100%;
    }

    .bell-tile {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #e1e4e8;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        gap: 14px;
        height: auto;
        align-self: start;
        transition: all 0.2s ease;
    }

    .bell-tile:hover {
        box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        border-color: #d1d5db;
    }

    .bell-row-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
    }

    .bell-meta {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    /* Custom Styled Checkbox */
    .bell-meta input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #006bb3;
    }

    .bell-title-text {
        font-weight: 700;
        font-size: 16px;
        color: #2c3e50;
        word-break: break-word;
    }

    .edit-icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: #f0f2f5 url('/static/pencil.svg') no-repeat center;
        background-size: 18px 18px;
        border: 1px solid #e1e4e8;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 0.2s, transform 0.1s;
    }

    .edit-icon-btn:hover {
        background-color: #e2e6ea;
    }

    .edit-icon-btn:active {
        transform: scale(0.95);
    }

    .bell-expansion-panel {
        display: none;
        border-top: 1px dashed #e1e4e8;
        padding-top: 14px;
        flex-direction: column;
        gap: 10px;
    }

    .time-rows-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 200px;
        overflow-y: auto;
    }

    .time-input-row {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .time-input-row button {
        background: #dc3545 !important;
        color: white !important;
        border: none !important;
        padding: 10px 14px;
    }

    .time-input-row button:hover {
        background: #bd2130 !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="time-manager-container">
    <h3>System Time Manager</h3>
    <div id="timeContainer">
        <input type="date" id="systemDatePicker" />
        <input type="time" id="systemTimePicker" step="1" />
        
        <div class="tz-search-container">
            <input type="text" id="timezoneFilterInput" placeholder="Search timezone..." oninput="filterTimezones()" class="tz-search-box"/>
            <select id="systemTimezoneSelect" size="1">
                <option value="">Loading timezones...</option>
            </select>
        </div>

        <button class="btn-primary" onclick="setSystemTime()">Set System Time</button>
    </div>

    <div style="margin-top: 10px;">
        <h3>Configured Schedules</h3>
        <div class="bell-list" id="bellList"></div>
    </div>

    <div style="margin-top: 10px;">
        <button class="btn-success" onclick="createNewBellTile()">+ Add New Bell Schedule</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/notifications.js"></script>
<script>
    let existingBells = [];
    let allTimezonesMasterList = [];

    window.onload = function() {
        loadBells();
        initTimezoneAndSelectors();
    };

    // Auto-populate options using documented system backend calls
    async function initTimezoneAndSelectors() {
        try {
            const now = new Date();
            document.getElementById('systemDatePicker').value = now.toISOString().split('T')[0];
            document.getElementById('systemTimePicker').value = now.toTimeString().split(' ')[0];

            // Fetch dynamic array from /get_timezones
            const tzRes = await fetch('/get_timezones');
            allTimezonesMasterList = await tzRes.json();
            
            repopulateTimezoneDropdown(allTimezonesMasterList);

            // Set default selected active zone context from /get_timezone
            const activeRes = await fetch('/get_timezone');
            const activeTz = await activeRes.text();
            document.getElementById('systemTimezoneSelect').value = activeTz.replace(/"/g, ''); 
        } catch(e) {}
    }

    function repopulateTimezoneDropdown(list) {
        const selectEl = document.getElementById('systemTimezoneSelect');
        selectEl.innerHTML = '';
        
        if(list.length === 0) {
            const opt = document.createElement('option');
            opt.innerText = "No matching zones found";
            selectEl.appendChild(opt);
            return;
        }

        list.forEach(tz => {
            const opt = document.createElement('option');
            opt.value = tz;
            opt.innerText = tz;
            selectEl.appendChild(opt);
        });
    }

    // Live search filter updates for the timezone dropdown selection list
    function filterTimezones() {
        const query = document.getElementById('timezoneFilterInput').value.toLowerCase().trim();
        const filtered = allTimezonesMasterList.filter(tz => tz.toLowerCase().includes(query));
        repopulateTimezoneDropdown(filtered);
    }

    // Post data to /set_time using the target exact layout string requirement
    async function setSystemTime() {
        const dateVal = document.getElementById('systemDatePicker').value;
        const timeVal = document.getElementById('systemTimePicker').value; 
        const tzVal = document.getElementById('systemTimezoneSelect').value;

        if (!dateVal || !timeVal || !tzVal) {
            showNotification("Missing Fields", "Please make sure Date, Time, and Timezone are specified completely.");
            return;
        }

        let formattedTime = timeVal;
        if (formattedTime.split(':').length === 2) {
            formattedTime += ":00";
        }

        const timestampIso = `${dateVal}T${formattedTime}.000000000Z`;

        try {
            await fetch('/set_time', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ time: timestampIso, timezone: tzVal })
            });
            showNotification("Update Successful", `System clock targeted to value: ${timestampIso}`);
            if (typeof updateTopbarTimezone === 'function') updateTopbarTimezone();
        } catch(e) {
            showNotification("Error", "Failed to update clock timestamp down to backend.");
        }
    }

    async function loadBells() {
        try {
            const res = await fetch('/get_bells');
            existingBells = await res.json();
            renderBellTiles();
        } catch(e) {}
    }

    function renderBellTiles() {
        const container = document.getElementById('bellList');
        container.innerHTML = '';

        existingBells.forEach((bell, index) => {
            const tile = document.createElement('div');
            tile.className = 'bell-tile';
            tile.id = `bell-tile-${index}`;

            tile.innerHTML = `
                <div class="bell-row-header">
                    <div class="bell-meta">
                        <input type="checkbox" id="check-${index}" ${bell.active ? 'checked' : ''} onchange="toggleBellActive('${bell.name}', this)">
                        <span class="bell-title-text">${bell.name}</span>
                    </div>
                    <button class="edit-icon-btn" onclick="toggleEditPanel(${index})" title="Edit Schedule"></button>
                </div>
                <div class="bell-expansion-panel" id="panel-${index}">
                    <div class="time-rows-container" id="time-container-${index}"></div>
                    <div style="margin-top:10px; display:flex; gap:8px; flex-direction: column;">
                        <button style="width: 100%;" onclick="addTimeInputRow(${index}, '')">+ Add Time</button>
                        <button class="btn-primary" style="width: 100%;" id="save-btn-${index}" onclick="saveBellEdits(${index}, '${bell.name}')">Save Changes</button>
                        <button style="width: 100%; background:#dc3545; color:white; border:none;" onclick="deleteBell('${bell.name}')">Delete Schedule</button>
                    </div>
                </div>
            `;
            container.appendChild(tile);
            
            bell.times.forEach(t => addTimeInputRow(index, t));
        });
    }

    async function toggleBellActive(name, checkbox) {
        const endpoint = checkbox.checked ? '/activate_bell' : '/disable_bell';
        const msg = checkbox.checked ? `Activated bell schedule ${name}` : `Disabled bell schedule ${name}`;
        
        try {
            await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: name })
            });
            showNotification("Status Updated", msg);
        } catch(e) {}
    }

    function toggleEditPanel(idx) {
        const panel = document.getElementById(`panel-${idx}`);
        panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
    }

    function addTimeInputRow(bellIdx, timeValue) {
        const container = document.getElementById(`time-container-${bellIdx}`);
        const row = document.createElement('div');
        row.className = 'time-input-row';

        let cleanedTime = timeValue.trim();
        if (cleanedTime) {
            const regex12 = /^(0?[1-9]|1[0-2]):([0-5][0-9]):([0-5][0-9])\s+([APap][Mm])$/;
            const match = cleanedTime.match(regex12);
            if (match) {
                let hrs = parseInt(match[1]);
                const mins = match[2];
                const secs = match[3];
                const ampm = match[4].toUpperCase();
                if (ampm === 'PM' && hrs < 12) hrs += 12;
                if (ampm === 'AM' && hrs === 12) hrs = 0;
                cleanedTime = `${hrs.toString().padStart(2, '0')}:${mins}:${secs}`;
            }
        }

        row.innerHTML = `
            <input type="time" step="1" value="${cleanedTime}">
            <button onclick="this.parentElement.remove()">-</button>
        `;
        container.appendChild(row);
    }

    async function saveBellEdits(bellIdx, originalName) {
        const container = document.getElementById(`time-container-${bellIdx}`);
        const inputs = container.querySelectorAll('input');
        
        const timesArray = Array.from(inputs).map(i => {
            let val = i.value;
            if (val && val.split(':').length === 2) {
                val += ":00";
            }
            return val;
        }).filter(val => val !== "");

        try {
            await fetch('/edit_bell', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: originalName, times: timesArray })
            });
            showNotification("Success", "Bell schedule options saved cleanly!");
            loadBells();
        } catch(e) {}
    }

    function createNewBellTile() {
        const nameInput = prompt("Enter Unique Bell Schedule Name:");
        if(!nameInput) return;
        
        const isDuplicate = existingBells.some(b => b.name.toLowerCase() === nameInput.trim().toLowerCase());
        if(isDuplicate) {
            showNotification("Error", "Names cannot be used more than once");
            return;
        }

        postNewBell(nameInput.trim());
    }

    async function postNewBell(bellName) {
        try {
            await fetch('/new_bell', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: bellName, times: [], active: false })
            });
            loadBells();
        } catch(e) {}
    }

    async function deleteBell(name) {
        try {
            await fetch('/remove_bell', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: name })
            });
            loadBells();
        } catch(e) {}
    }
</script>
{% endblock %}
