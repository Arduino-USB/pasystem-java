<!DOCTYPE html>
<html>
<head>
    <style>
        .topbar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ddd;
            padding: 0 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .topbar .left {
            display: flex;
            align-items: center;
            margin: 50px;
        }

        .topbar .right {
            display: flex;
            align-items: center;
        }

        .topbar a {
            width: 40px;
            height: 40px;
            display: block;
            text-decoration: none;
            margin-left: 10px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .topbar .config-btn {
            background-image: url('/static/wrench.svg');
        }

        .topbar .home-btn {
            background-image: url('/static/home.svg');
        }

        .topbar .bell-btn {
            background-image: url('/static/alarm-clock.svg');
        }

        #clock {
            font-size: 30px; 
            color: #333;
            font-weight: bold;
        }

        body {
            margin: 0;
            font-family: sans-serif;
        }

        .container {
            margin-top: 60px;
            padding: 20px;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>

<div class="topbar">
    <div class="left">
        <div id="clock"></div>
    </div>

    <div class="right">
        <a class="home-btn" href="/"></a>
        <a class="config-btn" href="/config"></a>
        <a class="bell-btn" href="/bell_config"></a>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');

    const ampm = hours >= 12 ? 'PM' : 'AM';

    hours = hours % 12;
    hours = hours ? hours : 12;

    const el = document.getElementById("clock");
    if (el) {
     el.textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
    }
}

setInterval(updateClock, 1000);
updateClock();
</script>

{% block scripts %}{% endblock %}

</body>
</html>
