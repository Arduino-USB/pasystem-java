<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1250px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e1e4e8;
            border-top: none;
            border-radius: 0 0 16px 16px;
            padding: 0 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            backdrop-filter: blur(12px);
            z-index: 1000;
            box-sizing: border-box;
        }

        .topbar .left {
            display: flex;
            align-items: center;
            gap: 20px;
            overflow: hidden;
            flex-wrap: nowrap;
        }

        .topbar .right {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .topbar a {
            width: 40px;
            height: 40px;
            display: block;
            text-decoration: none;
            margin-left: 10px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
            transition: transform 0.1s;
        }

        .topbar a:active {
            transform: scale(0.95);
        }

        .topbar .config-btn {
            background-image: url('/static/wrench.svg');
        }

        .topbar .home-btn {
            background-image: url('/static/home.svg');
        }

        .topbar .bell-btn {
            background-image: url('/static/alarm-clock.svg');
        }

        /* Unified, scalable font sizing */
        #clock, #date, #timezoneDisplay {
            font-size: clamp(18px, 2.5vw, 30px); 
            color: #333;
            font-weight: bold;
            font-family: sans-serif;
            white-space: nowrap;
        }

        .container {
            margin-top: 70px;
            padding: 20px;
        }
        
        @media (max-width: 600px) {
            .topbar {
                width: 100%;
                border-radius: 0;
                height: auto;
                padding: 10px;
                flex-direction: column;
                gap: 10px;
            }
            .topbar .left {
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .container {
                margin-top: 120px;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>

<div class="topbar">
    <div class="left">
        <div id="date">--</div>
        <div id="clock">--</div>
        <div id="timezoneDisplay">--</div>
    </div>

    <div class="right">
        <a class="home-btn" href="/"></a>
        <a class="config-btn" href="/config"></a>
        <a class="bell-btn" href="/bell_config"></a>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}

<script>
    (function() {
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const host = window.location.host;
        let timeWs = null;

        function connectTimeStream() {
            timeWs = new WebSocket(protocol + host + '/time_stream');
            
            timeWs.onmessage = function(event) {
                const timeStr = event.data; 
                if (timeStr && timeStr.includes('T')) {
                    const parts = timeStr.split('T');
                    const datePart = parts[0];
                    const clockPart = parts[1].substring(0, 8); // Extracts "HH:MM:SS"
                    
                    const timeSegments = clockPart.split(':');
                    let hours = parseInt(timeSegments[0], 10);
                    const minutes = timeSegments[1];
                    const seconds = timeSegments[2];
                    
                    const ampm = hours >= 12 ? 'PM' : 'AM';
                    hours = hours % 12;
                    hours = hours ? hours : 12; 
                    
                    const formattedClock = `${hours}:${minutes}:${seconds} ${ampm}`;
                    
                    const dateEl = document.getElementById('date');
                    const clockEl = document.getElementById('clock');
                    
                    if (dateEl) dateEl.innerText = datePart;
                    if (clockEl) clockEl.innerText = formattedClock;
                }
            };

            timeWs.onclose = function() {
                const dateEl = document.getElementById('date');
                const clockEl = document.getElementById('clock');
                if (dateEl) dateEl.innerText = '--';
                if (clockEl) clockEl.innerText = '--';

                setTimeout(connectTimeStream, 1000);
            };

            timeWs.onerror = function() {
                timeWs.close();
            };
        }
        
        async function updateTopbarTimezone() {
            try {
                const res = await fetch('/get_timezone');
                const tz = await res.text();
                const tzEl = document.getElementById('timezoneDisplay');
                if (tzEl) tzEl.innerText = tz.replace(/"/g, ''); 
            } catch(e) {
                const tzEl = document.getElementById('timezoneDisplay');
                if (tzEl) tzEl.innerText = '--';
            }
        }
        
        connectTimeStream();
        updateTopbarTimezone();
        setInterval(updateTopbarTimezone, 10000);
    })();
</script>

</body>
</html>
