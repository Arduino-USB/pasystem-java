{% extends "topbar" %}

{% block head %}
<title>Device Manager</title>

<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f6f9;
        overflow-x: hidden;
    }

    .device-manager-container {
        max-width: 900px;
        margin: 20px auto;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    h2 {
        color: #2c3e50;
        font-size: 22px;
        margin-bottom: 5px;
        font-weight: 700;
        letter-spacing: -0.3px;
    }

    .client {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #e1e4e8;
        border-radius: 16px;
        padding: 18px 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        backdrop-filter: blur(10px);
        transition: all 0.2s ease;
    }

    .client:hover {
        box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        border-color: #d1d5db;
    }

    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .client-actions {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .client-name-label {
        font-size: 16px;
        color: #2c3e50;
        font-weight: 600;
    }

    .small {
        font-size: 13px;
        color: #718096;
        margin-top: 2px;
    }

    .edit-panel {
        padding-top: 14px;
        border-top: 1px solid #edf2f7;
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .settings-loader-panel {
        font-size: 13px;
        color: #718096;
        font-style: italic;
    }

    label {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        font-weight: 600;
        color: #4a5568;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #cccccc;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        background: #ffffff;
    }

    input[type="text"]:focus {
        border-color: #006bb3;
        box-shadow: 0 0 0 3px rgba(0, 107, 179, 0.1);
    }

    button {
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
        transform: scale(0.98);
    }

    .save-device-btn {
        margin-top: 8px;
        padding: 10px 20px;
        background-color: #006bb3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        box-shadow: 0 4px 12px rgba(0, 107, 179, 0.2);
    }

    .save-device-btn:hover {
        background-color: #00558f;
    }

    .config-edit-btn, .config-reboot-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: 1px solid #e1e4e8;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
    }

    .config-edit-btn {
        background: #f0f2f5 url('/static/pencil.svg') no-repeat center;
        background-size: 18px 18px;
    }

    .config-reboot-btn {
        background: #fff5f5 url('/static/reboot.svg') no-repeat center;
        background-size: 18px 18px;
        border-color: #fed7d7;
    }

    .config-edit-btn:hover {
        background-color: #e2e6ea;
    }

    .config-reboot-btn:hover {
        background-color: #fee2e2;
        border-color: #fbc5c5;
    }

    .config-edit-btn:active, .config-reboot-btn:active {
        transform: scale(0.95);
    }
</style>
{% endblock %}

{% block content %}
<div class="device-manager-container">
    <h2>Connected Clients</h2>
    <div id="clientList" style="display: flex; flex-direction: column; gap: 12px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/notifications.js"></script>
<script>
    let internalClientsList = [];
    const openPanelsState = new Map(); // Tracks open states and intervals securely

    window.onload = function() {
        syncClients();
        setInterval(syncClients, 5000); // Steady background list verification sync cycle
    };

    async function syncClients() {
        try {
            const res = await fetch('/get_users');
            internalClientsList = await res.json();
            renderClientsView();
        } catch(e) {}
    }

    function renderClientsView() {
        const listDiv = document.getElementById('clientList');
        const currentIps = internalClientsList.map(c => c.ip);

        // 1. Housekeeping: Remove components for clients that no longer exist
        const activeTiles = listDiv.querySelectorAll('.client');
        activeTiles.forEach(tile => {
            if (!currentIps.includes(tile.dataset.clientIp)) {
                const tileIp = tile.dataset.clientIp;
                if (openPanelsState.has(tileIp)) {
                    clearInterval(openPanelsState.get(tileIp).intervalId);
                    openPanelsState.delete(tileIp);
                }
                tile.remove();
            }
        });

        // 2. Add or Update target rows safely without resetting inner elements
        internalClientsList.forEach((client, idx) => {
            let tile = listDiv.querySelector(`[data-client-ip="${client.ip}"]`);
            
            if (!tile) {
                tile = document.createElement('div');
                tile.className = 'client';
                tile.dataset.clientIp = client.ip;
                
                tile.innerHTML = `
                    <div class="row">
                        <div>
                            <div class="client-name-label">${client.name}</div>
                            <div class="small">IP Address: ${client.ip}</div>
                        </div>
                        <div class="client-actions">
                            <button class="config-reboot-btn" title="Reboot Device"></button>
                            <button class="config-edit-btn" title="Configure Device"></button>
                        </div>
                    </div>
                    <div class="edit-panel" style="display: none;">
                        <div class="settings-loader-panel">Loading settings profile from device...</div>
                    </div>
                `;
                listDiv.appendChild(tile);
            } else {
                tile.querySelector('.client-name-label').innerText = client.name;
            }

            const editBtn = tile.querySelector('.config-edit-btn');
            editBtn.onclick = () => toggleClientSettingsView(tile, client.ip);

            const rebootBtn = tile.querySelector('.config-reboot-btn');
            rebootBtn.onclick = () => rebootDeviceUnit(client.ip);
        });
    }

    async function rebootDeviceUnit(ip) {
        if (!confirm(`Are you sure you want to reboot the hardware unit at IP: ${ip}?`)) {
            return;
        }

        try {
            const targetUrl = `http://${ip}:6742/reboot`;
            await fetch(targetUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });
            
            showNotification("Reboot Command Dispatched", `Hard restart sequence successfully initialized for device unit at IP: ${ip}.`);
        } catch(e) {
            showNotification("Transmission Failure", `Unable to route reboot command frame downstream to target node at ${ip}.`);
        }
    }

    async function toggleClientSettingsView(tileElement, ip) {
        const panel = tileElement.querySelector('.edit-panel');
        const loaderContainer = tileElement.querySelector('.settings-loader-panel');

        if (panel.style.display === 'block') {
            panel.style.display = 'none';
            if (openPanelsState.has(ip)) {
                clearInterval(openPanelsState.get(ip).intervalId);
                openPanelsState.delete(ip);
            }
            return;
        }
        
        panel.style.display = 'block';

        async function fetchSettingsUpdate() {
            try {
                const targetUrl = `http://${ip}:6742/get_settings`;
                const res = await fetch(targetUrl);
                const settingsData = await res.json();
                
                updateOrBuildSettingsForm(panel, loaderContainer, ip, settingsData);
            } catch(e) {
                if (!panel.querySelector('.settings-form-container')) {
                    loaderContainer.innerHTML = `<span style="color:#d9534f; font-weight:600;">Error connecting directly to hardware unit at ${ip}:6742</span>`;
                }
            }
        }

        await fetchSettingsUpdate();
        const intervalId = setInterval(fetchSettingsUpdate, 1000);
        openPanelsState.set(ip, { intervalId });
    }

    function updateOrBuildSettingsForm(panel, loaderElement, ip, settings) {
        let formContainer = panel.querySelector('.settings-form-container');

        if (!formContainer) {
            loaderElement.style.display = 'none';
            formContainer = document.createElement('div');
            formContainer.className = 'settings-form-container';
            formContainer.style.display = 'flex';
            formContainer.style.flexDirection = 'column';
            formContainer.style.gap = '10px';
            panel.appendChild(formContainer);
        }

        for (const [key, value] of Object.entries(settings)) {
            let inputField = formContainer.querySelector(`[data-setting-key="${key}"]`);

            if (!inputField) {
                const fieldWrapper = document.createElement('div');
                
                let displayLabel = key.replace(/_/g, ' ');
                displayLabel = displayLabel.charAt(0).toUpperCase() + displayLabel.slice(1);

                const label = document.createElement('label');
                label.innerText = `${displayLabel}:`;
                
                inputField = document.createElement('input');
                inputField.type = 'text';
                inputField.dataset.settingKey = key;
                
                fieldWrapper.appendChild(label);
                fieldWrapper.appendChild(inputField);
                formContainer.appendChild(fieldWrapper);
            }

            if (document.activeElement !== inputField) {
                inputField.value = value;
            }
        }

        let saveButton = formContainer.querySelector('.save-device-btn');
        if (!saveButton) {
            saveButton = document.createElement('button');
            saveButton.className = 'save-device-btn';
            saveButton.innerText = "Save Device Settings";
            formContainer.appendChild(saveButton);
        }
        saveButton.onclick = () => saveDeviceSettingsPayload(formContainer, ip);
    }

    async function saveDeviceSettingsPayload(formContainer, ip) {
        const inputFields = formContainer.querySelectorAll('input');
        const updatePayload = {};

        inputFields.forEach(field => {
            const key = field.dataset.settingKey;
            const val = field.value;
            updatePayload[key] = val;
        });

        try {
            const targetUrl = `http://${ip}:6742/update_settings`;
            await fetch(targetUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(updatePayload)
            });
            
            showNotification("Hardware Configured", `Direct structural upload modification dispatched to client IP: ${ip} complete.`);
        } catch(e) {
            showNotification("Transmission Failure", `Unable to route configuration save frame downstream to target node.`);
        }
    }
</script>
{% endblock %}
