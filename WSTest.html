<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #log {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: scroll;
            white-space: pre-wrap;
            background: #f8f8f8;
        }

        input {
            width: 400px;
            margin-bottom: 5px;
        }

        button {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<h2>WebSocket Tester</h2>

<input id="url" value="ws://localhost:6741/time_stream" />
<button onclick="connect()">Connect</button>
<button onclick="disconnect()">Disconnect</button>

<br><br>

<h3>Send Text</h3>
<input id="textMsg" placeholder="Enter text message..." />
<button onclick="sendText()">Send Text</button>

<br><br>

<h3>Send Binary (Hex Bytes)</h3>
<input id="binMsg" placeholder="Example: 48 65 6C 6C 6F" />
<button onclick="sendBinary()">Send Binary</button>

<p>Status: <span id="status">Disconnected</span></p>

<div id="log"></div>

<script>
let ws;

function log(msg) {
    const logBox = document.getElementById("log");
    logBox.textContent += msg + "\n";
    logBox.scrollTop = logBox.scrollHeight;
}

function setStatus(status) {
    document.getElementById("status").textContent = status;
}

function connect() {
    const url = document.getElementById("url").value;

    ws = new WebSocket(url);

    // Receive binary frames as ArrayBuffer
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
        setStatus("Connected");
        log("[OPEN]");
    };

    ws.onmessage = (event) => {
        if (typeof event.data === "string") {
            log("[TEXT RECEIVED] " + event.data);
        } else {
            const bytes = new Uint8Array(event.data);

            const hex = Array.from(bytes)
                .map(b => b.toString(16).padStart(2, "0"))
                .join(" ");

            log("[BINARY RECEIVED] " + hex);
        }
    };

    ws.onerror = (event) => {
        log("[ERROR]");
        console.error(event);
    };

    ws.onclose = (event) => {
        setStatus("Disconnected");
        log("[CLOSED] code=" + event.code);
    };
}

function disconnect() {
    if (ws) {
        ws.close();
    }
}

function sendText() {
    const msg = document.getElementById("textMsg").value;

    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(msg);
        log("[TEXT SENT] " + msg);
    } else {
        log("[WARN] Not connected");
    }
}

function sendBinary() {
    const hexInput = document.getElementById("binMsg").value.trim();

    if (!(ws && ws.readyState === WebSocket.OPEN)) {
        log("[WARN] Not connected");
        return;
    }

    try {
        const bytes = hexInput
            .split(/\s+/)
            .filter(x => x.length > 0)
            .map(hex => {
                const value = parseInt(hex, 16);

                if (isNaN(value) || value < 0 || value > 255) {
                    throw new Error("Invalid byte: " + hex);
                }

                return value;
            });

        const binaryData = new Uint8Array(bytes);

        ws.send(binaryData);

        log("[BINARY SENT] " + bytes.length + " bytes");
        log("              " + hexInput);
    }
    catch (e) {
        log("[ERROR] " + e.message);
    }
}
</script>

</body>
</html>
